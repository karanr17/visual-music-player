name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so --history also catches a key added and then deleted within the PR.
          fetch-depth: 0
      - run: scripts/check-secrets.sh
      - run: scripts/check-secrets.sh --history

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Includes the check that src/analysis/schema.ts still matches the vendored SongAnalysis schema.
      - run: npm test
      - run: npx vite build

  plates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The prompt planning and layer split only; the models need Apple Silicon and ~10 GB.
      - run: uv run --python 3.12 --no-project --with numpy --with pillow --with opencv-python-headless --with pytest pytest -q tests
        working-directory: scripts/plates
        env:
          PYTHONPATH: .
