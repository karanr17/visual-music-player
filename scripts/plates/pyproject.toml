[project]
name = "vmp-plates"
version = "0.1.0"
description = "Generates illustrated-mode backdrop plates for visual-music-player scene scripts"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mflux==0.24.0",
  "numpy>=2",
  "opencv-python>=4.10",
  "pillow>=11",
  "torch>=2.13",
  "transformers>=5.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
plates = "plates.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plates"]
